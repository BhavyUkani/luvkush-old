<section class="cats lk-section" aria-labelledby="cats-title">
  <div class="lk-shell">

    <div class="lk-head">
      <div>
        <span class="lk-eyebrow">Shop by ritual</span>
        <h2 class="lk-title" id="cats-title">Everything your <em>routine</em> asks for</h2>
      </div>
      <a class="lk-link" routerLink="/shop">
        Browse all products
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </div>

    @if (loading()) {
      <div class="cats__grid">
        @for (s of skeletons; track s) {
          <div class="cats__card cats__card--skeleton" aria-hidden="true"></div>
        }
      </div>
    } @else {
      <div class="cats__grid">
        @for (cat of categories(); track cat.id; let i = $index) {
          <a class="cats__card" routerLink="/shop" [queryParams]="{ category: cat.slug }"
             [lkReveal]="i" [attr.aria-label]="cat.name">
            <div class="cats__media">
              <img
                [src]="imgUrl(cat.image_url)"
                [alt]="cat.name"
                loading="lazy"
                width="400" height="400"
                (error)="$any($event.target).src='/assets/images/placeholder.webp'"
              />
            </div>
            <div class="cats__body">
              <h3 class="cats__name">{{ cat.name }}</h3>
              <p class="cats__blurb">{{ blurb(cat.slug) || cat.description }}</p>
              <span class="cats__cta">
                Shop now
                <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                  <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
            </div>
          </a>
        }
      </div>
    }

  </div>
</section>
