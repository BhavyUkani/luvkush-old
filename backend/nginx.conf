# ==============================================================================
# Nginx Site Configuration for Luv Kush Natural
# Save this file to: /etc/nginx/sites-available/luvkush
# Link it to enabled: ln -s /etc/nginx/sites-available/luvkush /etc/nginx/sites-enabled/
#
# TLS setup (required — Razorpay Checkout itself requires HTTPS in production,
# and every login/session/payment request is plaintext-interceptable without
# it): point DNS at this server, then run
#   sudo certbot --nginx -d yourdomain.com
# which will rewrite the server_name/ssl_certificate lines below for you.
# Until a real domain + certificate exists, this file still serves plain
# HTTP as a fallback — replace `server_name _;` with your domain once ready.
# ==============================================================================

server {
    # Plain HTTP is kept only to redirect to HTTPS once a certificate exists.
    # Until then (no domain/cert yet) this block serves the site directly —
    # swap the block below for the HTTPS one as soon as certbot has run.
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # ── Root Directory and Logging ────────────────────────────────────────────
    root /var/www/luvkush-old;

    access_log /var/log/nginx/luvkush.access.log;
    error_log /var/log/nginx/luvkush.error.log warn;

    # Max body size for product images or review uploads
    client_max_body_size 15M;

    # Uncomment once certbot has issued a certificate for a real domain,
    # and delete everything below this line down to the closing brace
    # (certbot's redirect block replaces it):
    #
    # location / { return 301 https://$host$request_uri; }

    # ── Gzip Compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ── Static Uploads Path (Directly served by Nginx for speed) ──────────────
    # A location block that sets its own add_header does NOT inherit the
    # server-level add_header directives below — nosniff/frame-options must
    # be repeated here explicitly, otherwise user-uploaded content is served
    # with none of them and can be sniffed/executed as active content.
    location /uploads/ {
        alias /var/www/luvkush-old/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin "*";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
    }

    # ── Application Reverse Proxy ──────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8803; # Forward requests to Node.js on port 8803
        proxy_http_version 1.1;
        
        # KeepAlive/Upgrade headers for connection reuse or WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Client IP header forwarding
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Proxy timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── Security Headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
}

# ==============================================================================
# HTTPS server block template — certbot normally generates this
# automatically via `certbot --nginx`. If configuring TLS by hand instead:
# 1. Copy every location/gzip/security-header line from the HTTP server
#    block above into this block.
# 2. Replace server_name and the ssl_certificate paths below.
# 3. Change the HTTP server block above to only `return 301 https://...`.
# 4. Add `add_header Strict-Transport-Security "max-age=63072000" always;`
#    to the security headers once HTTPS is confirmed working.
# ==============================================================================
# server {
#     listen 443 ssl http2;
#     listen [::]:443 ssl http2;
#     server_name yourdomain.com;
#
#     ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_ciphers HIGH:!aNULL:!MD5;
#
#     # ... (same root/logging/gzip/uploads/proxy/security-header blocks as above)
# }
