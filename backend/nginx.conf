# ==============================================================================
# Nginx Site Configuration for Luv Kush Natural (VPS IP Address Setup)
# Access URL: http://<YOUR_VPS_IP>
# Save this file to: /etc/nginx/sites-available/luvkush
# Link it to enabled: ln -s /etc/nginx/sites-available/luvkush /etc/nginx/sites-enabled/
# ==============================================================================

server {
    # Listen on standard HTTP port 80 (default server matches any IP address request)
    listen 80 default_server;
    listen [::]:80 default_server;
    
    # '_' matches any host header (including direct IP addresses)
    server_name _;

    # ── Root Directory and Logging ────────────────────────────────────────────
    root /var/www/luvkush-old;
    
    access_log /var/log/nginx/luvkush.access.log;
    error_log /var/log/nginx/luvkush.error.log warn;

    # Max body size for product images or review uploads
    client_max_body_size 15M;

    # ── Gzip Compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ── Static Uploads Path (Directly served by Nginx for speed) ──────────────
    location /uploads/ {
        alias /var/www/luvkush-old/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # ── Application Reverse Proxy ──────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8803; # Forward requests to Node.js on port 8803
        proxy_http_version 1.1;
        
        # KeepAlive/Upgrade headers for connection reuse or WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Client IP header forwarding
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Proxy timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── Security Headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
}
