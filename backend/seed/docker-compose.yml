services:
  mysql:
    image: mysql:8.0
    container_name: luvkush-mysql
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: luvkush_natural
    ports:
      - "3306:3306"
    volumes:
      - luvkush_mysql_data:/var/lib/mysql
      - ./dump.sql:/docker-entrypoint-initdb.d/01-dump.sql:ro

volumes:
  luvkush_mysql_data:
