name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            # 1. Navigate to application folder on VPS
            cd /var/www/luvkush-old

            # 2. Pull the latest code from GitHub
            git fetch origin
            git reset --hard origin/main

            # 3. Build Backend (Important: Must compile TypeScript to JS)
            cd backend
            npm install
            npm run build

            # 4. Build Frontend
            cd ../frontend
            npm install
            npm run build

            # 5. Restart Phusion Passenger app
            # Creating/touching tmp/restart.txt is the standard, zero-downtime restart mechanism for Passenger
            cd ../backend
            mkdir -p tmp
            touch tmp/restart.txt

            echo "Deployment completed successfully!"
