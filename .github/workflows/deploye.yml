name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /var/www/luvkush-old
            echo ${{ secrets.VPS_HOST }}
            git fetch origin
            git reset --hard origin/main

            cd backend
            npm install --production
            cd ..
            cd frontend
            npm install --production
            npm run build
            

            passenger-config restart-app /var/www/luvkush-old/backend

            echo "Deployment completed"